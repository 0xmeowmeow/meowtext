[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meowtext"
version = "0.2.0"
description = "TUI for ASCII and ANSI banners from FIGlet, TOIlet, and TheDraw fonts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8",
    "rich>=13",
    "pillow>=10",
]

[project.scripts]
meowtext = "meowtext.__main__:main"

[tool.setuptools.packages.find]
include = ["meowtext*"]
