[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meowtext"
version = "1.3.2"
description = "Compare fonts, make ANSI art, and bring it into Kitty"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8,<9",
    "rich>=13",
    "pillow>=10,<14",
    "textual-image>=0.14,<0.15",
]

[project.scripts]
meowtext = "meowtext.__main__:main"

[project.urls]
Homepage = "https://meow-meow.io/meowtext/"
Repository = "https://github.com/0xmeowmeow/meowtext"
Issues = "https://github.com/0xmeowmeow/meowtext/issues"

[tool.setuptools.packages.find]
include = ["meowtext*"]
